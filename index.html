<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎵Joda Child 睡前晚安曲🎶</title>
  <style id="theme-style">
    /* 預設主題: 黑金 */
    body {
      background-color: #1e1e1e;
      color: #fdd835;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    #theme-selector {
      margin: 0 auto 20px;
      display: block;
    }
    #nowPlaying {
      text-align: center;
      font-weight: bold;
    }
    audio {
      width: 100%;
      margin: 10px 0;
    }
    ul#playlist {
      list-style: none;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ccc;
    }
    ul#playlist li {
      padding: 10px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }
    ul#playlist li.active {
      background: #fdd835;
      color: #000;
      font-weight: bold;
    }
    #history {
      margin-top: 30px;
      padding: 15px;
      background: #2c2c2c;
      color: #fff;
      border-radius: 8px;
    }
    .version {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 0.75em;
      color: #888;
    }
  </style>
</head>
<body>
  <h2>🎵Joda Child 睡前晚安曲🎶</h2>
  <label for="theme-selector">切換主題:</label>
  <select id="theme-selector">
    <option value="blackgold">黑金風</option>
    <option value="neon">霜光夜</option>
    <option value="lightblue">明亮白藍</option>
    <option value="retro">復古磁帶</option>
  </select>

  <div id="nowPlaying">載入中...</div>
  <audio id="audioPlayer" controls></audio>
  <ul id="playlist"></ul>

  <div id="history">
    <h3>更新日誌</h3>
    <ul id="historyList"></ul>
  </div>

  <div class="version">v1.1.0</div>

  <script>
    const themes = {
      blackgold: `body { background:#1e1e1e;color:#fdd835; } ul#playlist li.active{background:#fdd835;color:#000}`,
      neon: `body { background:#0f0f2e;color:#39ff14; } ul#playlist li.active{background:#39ff14;color:#000}`,
      lightblue: `body { background:#f0faff;color:#003366; } ul#playlist li.active{background:#003366;color:#fff}`,
      retro: `body { background:#3b2f2f;color:#ffd700; } ul#playlist li.active{background:#ffd700;color:#000}`
    };

    const themeSelector = document.getElementById('theme-selector');
    themeSelector.addEventListener('change', e => {
      const styleEl = document.getElementById('theme-style');
      styleEl.innerHTML = themes[e.target.value];
    });

    let playlist = [];
    let current = 0;
    const player = document.getElementById('audioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');
    const historyList = document.getElementById('historyList');

    const versionTag = `v=${Date.now()}`;

    fetch(`playlist.json?${versionTag}`)
      .then(res => res.json())
      .then(data => {
        playlist = data.tracks || data;
        if (playlist.length === 0) {
          nowPlaying.textContent = "\u627e\u4e0d\u5230\u97f3\u6a02\u6a94";
          return;
        }
        setupPlaylist();
        playTrack(current);
        if (data.history && Array.isArray(data.history)) {
          data.history.forEach(entry => {
            const li = document.createElement('li');
            li.textContent = entry;
            historyList.appendChild(li);
          });
        }
      });

    function setupPlaylist() {
      const ul = document.getElementById('playlist');
      ul.innerHTML = '';
      playlist.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = item.name;
        li.addEventListener('click', () => {
          playTrack(index);
        });
        ul.appendChild(li);
      });
    }

    function playTrack(index) {
      current = index;
      player.src = playlist[current].url;
      nowPlaying.textContent = `\u73fe\u5728\u64ad\u653e: ${playlist[current].name}`;
      highlightCurrent();
      player.play().catch(() => {
        nowPlaying.textContent = "\u8acb\u9ede\u64ad\u653e\u9375\u958b\u59cb\u64ad\u653e";
      });
    }

    function highlightCurrent() {
      const listItems = document.querySelectorAll('#playlist li');
      listItems.forEach((li, idx) => {
        li.classList.toggle('active', idx === current);
      });
    }

    player.onended = () => {
      current = (current + 1) % playlist.length;
      playTrack(current);
    };
  </script>
</body>
</html>
